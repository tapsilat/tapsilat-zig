name: Zig Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.17.0

      - name: Zig version
        run: zig version

      - name: Check formatting
        run: zig fmt --check src examples build.zig

      - name: Build and test
        run: zig build test && zig build
